<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 385" font-family="'Segoe Print','Comic Sans MS','Chalkboard SE',cursive" font-size="16">
  <rect width="820" height="385" fill="white"/>

  <!-- title -->
  <text x="410" y="36" text-anchor="middle" font-size="22">how netblock works</text>
  <path d="M300 46 q55 5 110 1 q60 -4 110 2" fill="none" stroke="black" stroke-width="2" stroke-linecap="round"/>

  <!-- phone -->
  <path d="M46 82 q-8 5 -7 16 l4 258 q1 13 14 13 l178 -3 q12 -1 11 -13 l-3 -258 q-1 -13 -14 -13 l-172 -3 q-7 0 -11 3 z"
        fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M108 96 q26 4 54 0" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round"/>

  <!-- blocked apps -->
  <path d="M72 130 q-5 4 -4 10 l2 62 q0 9 10 9 l124 -2 q9 -1 8 -10 l-2 -60 q-1 -9 -10 -9 l-119 -2 q-6 0 -9 2 z"
        fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round"/>
  <text x="140" y="169" text-anchor="middle" fill="#c0392b">blocked</text>
  <text x="140" y="190" text-anchor="middle" fill="#c0392b">apps</text>

  <!-- other apps -->
  <path d="M74 246 q-6 3 -5 11 l3 60 q1 9 10 9 l122 -3 q9 0 8 -10 l-3 -58 q0 -9 -10 -9 l-117 -2 q-5 0 -8 2 z"
        fill="none" stroke="#27ae60" stroke-width="2.5" stroke-linecap="round"/>
  <text x="140" y="283" text-anchor="middle" fill="#27ae60">other</text>
  <text x="140" y="304" text-anchor="middle" fill="#27ae60">apps</text>

  <!-- blocked -> tunnel -->
  <path d="M214 170 q78 4 150 6" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M351 167 L366 176 L350 184" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- tunnel: two wobbly rails, like a pipe -->
  <path d="M378 146 q70 -8 138 4" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M376 202 q70 10 140 -2" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M378 146 q-8 28 -2 56" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M516 150 q6 26 0 50" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  <text x="447" y="182" text-anchor="middle" font-size="15">vpn tunnel</text>

  <!-- tunnel -> black hole -->
  <path d="M520 176 q58 2 112 4" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M621 171 L636 180 L620 188" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- black hole -->
  <path d="M672 142 q36 -10 56 18 q17 25 0 50 q-18 26 -50 20 q-31 -6 -35 -36 q-4 -32 25 -49 q2 -2 4 -3 z"
        fill="black"/>
  <text x="700" y="122" text-anchor="middle" font-size="14">dropped, never read</text>

  <!-- other -> internet, under the tunnel -->
  <path d="M214 286 q170 30 330 12 q60 -7 104 -21" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M636 274 L650 277 L640 288" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- internet cloud -->
  <path d="M654 278 q-3 -17 15 -21 q4 -16 23 -13 q11 -12 27 -5 q17 -8 27 7 q17 1 18 17 q13 7 6 21 q3 15 -14 18 q-5 12 -21 9 q-11 10 -25 3 q-15 8 -27 -3 q-17 3 -22 -12 q-13 -5 -7 -21 z"
        fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  <text x="712" y="290" text-anchor="middle" font-size="14">internet</text>

</svg>
